schema_version: 1

context:
  version: "0.4.1"

package:
  name: physicskit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/physicskit/physicskit-${{ version }}.tar.gz
  sha256: d1f26adbd1137d43edb7fac4e719b213ed9a9e24609b1024f78e104c24f2b240

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
    - wheel
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.6
    - numba >=0.58
    - plotly >=5.15
    - sympy >=1.11
    - tqdm >=4.65

tests:
  - python:
      imports:
        - physicskit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/physicskit
  repository: https://github.com/cpoli/physicskit
  documentation: https://cpoli.github.io/physicskit/
  summary: Unified scientific toolkit for computational physics
  description: |
    General Relativity, Quantum Mechanics, Chaos, Random Matrix Theory, Statistical Mechanics, Classical Dynamics, and Condensed Matter.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
